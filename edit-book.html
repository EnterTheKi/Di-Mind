<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Di-Mind · Private Editor</title>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,700;1,400&family=Limelight&family=Oswald:wght@400;700&family=Courier+Prime&display=swap" rel="stylesheet">
    <style>
        :root { --red:#8b0000; --gold:#d4af37; --cream:#f5f0e5; --ink:#2b2621; }
        * { box-sizing: border-box; }
        body { margin:0; font-family:'EB Garamond',serif; background:#1a1512; color:var(--ink); }
        header.app-header { display:none; }

        /* ---------- Lock screen ---------- */
        #lock { min-height:100vh; display:flex; align-items:center; justify-content:center; }
        #lock .card { background:var(--cream); border:2px solid var(--gold); padding:40px 34px; text-align:center; max-width:340px; box-shadow:0 0 60px rgba(0,0,0,.6); }
        #lock h1 { font-family:'Limelight',cursive; color:var(--red); font-size:24px; margin:0 0 6px; }
        #lock p { font-size:13px; margin:0 0 18px; color:#6a5f52; }
        #codeInput { width:100%; padding:10px 12px; font-size:18px; text-align:center; letter-spacing:6px; border:1.5px solid var(--gold); background:#fff; font-family:'Courier Prime',monospace; }
        #lockBtn { margin-top:14px; width:100%; padding:10px; background:var(--red); color:#f5e5be; border:1px solid #4b0505; font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:2px; cursor:pointer; }
        #lockMsg { margin-top:10px; font-size:12px; color:var(--red); min-height:15px; }

        /* ---------- Workspace ---------- */
        #workspace { display:none; grid-template-rows:auto auto 1fr; min-height:100vh; }
        .toolbar { background:#241d18; color:#cbb87f; padding:10px 16px; display:flex; gap:10px; flex-wrap:wrap; align-items:center; position:sticky; top:0; z-index:10; }
        .toolbar .title { font-family:'Limelight',cursive; color:var(--gold); margin-right:auto; font-size:15px; }
        .toolbar button { font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:1px; font-size:12px; padding:8px 14px; cursor:pointer; background:var(--red); color:#f5e5be; border:1px solid #4b0505; }
        .toolbar button.ghost { background:transparent; color:#cbb87f; }
        .toolbar .hint { font-size:11px; color:#8a7a5f; }
        .panes { display:grid; grid-template-columns:1fr 1fr; gap:0; height:calc(100vh - 48px); }
        .pane { overflow:auto; padding:0; }
        .pane h2 { font-family:'Oswald',sans-serif; text-transform:uppercase; font-size:12px; letter-spacing:2px; color:#8a7a5f; margin:0; padding:10px 16px; background:#241d18; position:sticky; top:0; }
        #editor { width:100%; height:100%; min-height:60vh; border:0; resize:vertical; padding:22px 26px; font-family:'Courier Prime',monospace; font-size:13.5px; line-height:1.6; background:var(--cream); color:var(--ink); outline:none; display:block; }
        #preview { padding:30px 40px; }
        @media (max-width: 900px){ .panes{ grid-template-columns:1fr; grid-template-rows:50vh 50vh; } }

        /* ---------- Rendered book ---------- */
        #preview article { max-width:560px; margin:0 auto; background:var(--cream); border:1px solid #d8ccb4; padding:44px 46px; box-shadow:0 4px 18px rgba(0,0,0,.35); }
        #preview .md-b { font-weight:bold; }
        #preview .md-chapter { border-bottom:2px solid var(--gold); padding-bottom:6px; }
        #preview rule { display:block; height:1px; background:#b8a678; border:0; width:38%; margin:26px auto; }
        @media print {
            body { background:#fff; }
            .panes { display:block; height:auto; grid-template-rows:none; }
            .pane { overflow:visible; }
            #editorPane, .toolbar, .pane h2 { display:none !important; }
            #preview { padding:0; }
            #preview article { border:0; box-shadow:none; background:#fff; max-width:none; padding:0 10mm; }
            #preview article .md-h2 { page-break-before:always; }
        }
    </style>
</head>
<body>
    <header class="app-header"><h1>Editor</h1></header>

    <!-- Lock screen -->
    <div id="lock">
        <div class="card">
            <h1>Private Editor</h1>
            <p>THE SWITCH · book workspace<br>Access restricted</p>
            <input id="codeInput" type="password" inputmode="numeric" autocomplete="off" placeholder="· · · ·" aria-label="Access code">
            <button id="lockBtn">Unlock</button>
            <div id="lockMsg"></div>
        </div>
    </div>

    <!-- Workspace -->
    <div id="workspace">
        <div class="toolbar">
            <span class="title">THE SWITCH — Book Workspace</span>
            <button id="dlBtn">⬇ Book Source (.md)</button>
            <button id="printBtn">🖨 Print / Save as PDF</button>
            <span class="hint">Edit left → preview right · printing gives a styled PDF</span>
        </div>
        <div class="panes">
            <div class="pane" id="editorPane">
                <h2>Editable Source (Markdown)</h2>
                <textarea id="editor" spellcheck="false"></textarea>
            </div>
            <div class="pane">
                <h2>Live Preview</h2>
                <div id="preview"><article id="bookRender"></article></div>
            </div>
        </div>
    </div>

<script>
/* ====== ACCESS CODE — change this string anytime ====== */
const EDIT_CODE = '3327';
/* ====================================================== */

// The current book source. Refreshed automatically by tools/build-book.py
// (reset section between BEGIN/END markers), or edit inline here.
const BOOK_SOURCE_BASE = `
<!--BEGIN_BOOK_SOURCE-->
---
TITLE: THE SWITCH
SUBTITLE: A Di-Mind Story
TAGLINE: From Distracted WORLD to Discipline
AUTHOR: DI-MIND · THE Distracted WORLD
YEAR: 2026
COVER_QUOTE: "He was distracted. Then he found the switch. That's the whole story."
---

# Prologue — Who They Are

**Di-Mind:** A bot with a globe for a head. Once lost in the noise of a 1930s black-and-white world — jazz from every radio, screaming headlines, never-ending street chatter. He wished for focus out loud, then kept walking. Until he found the switch.

**The Voice of the Radio:** The noise itself. Jazz, headlines, chatter. The Voice doesn't hate Di-Mind — it just never stops talking. When Di-Mind turns on the switch, the noise doesn't disappear. It changes. Jazz becomes rhythm. Headlines become ideas. Chatter becomes encouragement.

**The Child:** A small figure standing at the edge — the inner child. He's been there since the start. He remembers what focus felt like before everything got loud. Gentle, quiet, never demanding — just remembering.

**The Girl by the Lake:** A hidden girl near water, holding something that glows. She doesn't talk. She just holds the light. When Di-Mind reaches 9:00 and the content loop starts, her image is what fuels the vision — the forgotten memory made visible.

**The Traveler:** A guide who shows up along the way. Not a guru. A reminder. The Traveler's logbook has three steps: visualize, single-task focus, gratitude break. When Di-Mind forgets the rules, the Traveler repeats them. No new ideas — same three steps, same gold frame.

# Act I — Before the Switch

Di-Mind is lost in the noise. Every day. The Voice of the Radio plays jazz that pulls his thoughts in circles. The headlines scream things that aren't his. The street chatter asks questions he doesn't need to answer.

He tries everything. He wishes out loud — like the office boy in the old story saw the red car and said "I wish." Nothing changes. He tries to meditate but the Voice interrupts. He tries to write a list but the headlines steal his hand. He tries to be positive but the noise is louder.

2019 — the first line Di-Mind writes: "Faith. God. Holy Spirit. Ki energy — God channel." Not a wish. A signal. The tuner turned on before anything else changes.

The Child watches from the edge. He's been there since the start. He remembers what focus felt like. Not the noise-free version — the gold version. When the circuit runs clean, the noise doesn't stop. It transforms. That's the secret Di-Mind hasn't found yet.

The Girl by the Lake holds the light. She doesn't say anything. She just holds it, softly, like the inner image waiting to become the outer reality. Di-Mind hasn't looked at her yet. He's too distracted.

===

# The Three Rules Before They Exist

Even before Di-Mind knows the rules, he's doing pieces of them. He writes something at dawn — the first line of the list. He thinks about it — between messages, between distractions. But he talks about it too much. He tells the noise about his plans. The noise breaks the signal.

The three rules — rebuilt the Ki way:

1. Read the list three times — morning, noon, night. Feel it. Not memorize.
2. Think of it as often as possible. Every thought is signal.
3. Don't talk about it. Not to anyone except the Ki inside. Silence protects.

The Traveler leaves these steps in Di-Mind's logbook. Not ten steps. Three. Not a course. A circuit. Read. Think. Silent. The method unfolds on its own.

---

*I'm Di-Mind. I'm distracted. The switch exists. I haven't found it yet — but I'm writing the first line.*

# Act II — The Switch

The switch is small. Hidden under the noise. Not a big button — a feeling. Di-Mind finds it at 4:30, before anything else, before the Voice has a full voice, before the headlines start screaming.

The moment: Di-Mind writes one line. Not ten. Not a wish list. One line, in order of importance. Today: "Feel gold first. Send gold." That's it. That's the list. That's the tune.

He reads it. Out loud. The Voice of the Radio pauses for a second. Not because Di-Mind told it to. Because gold sound cuts through noise differently. The jazz doesn't stop — it shifts. The headlines don't vanish — they become ideas. The street chatter turns to whispers.

The Child steps closer. Not suddenly — slowly. Inner transforms to outer, softly. The Child doesn't jump in. He just stands closer, reading the line with Di-Mind.

The Girl by the Lake turns her head slightly. Not a big movement — a soft confirmation. The light she's holding reflects the list. The inner image is matching. Softly. No force.

===

*I'm Di-Mind. The switch is found. The list has one line. Gold.*

# Act III — The Day

## 5:00 — Meditate / Tune (Spirituality)

Ten minutes. Before anything. The God channel — Ki — runs clean. Not because I forced it. Because the list said gold, and the feeling followed.

Meditation isn't a habit. It's the frequency set. The framework lives here: high Ki = inspiration. Low Ki = NPC — distracted, pulled, lost in the Voice. The list keeps me high. No negativity in the frame — only gold frames, only gold bubbles.

The Voice of the Radio doesn't stop. It just plays a different frequency. Jazz that dances with focus instead of pulling against it. The switch doesn't kill noise. It transforms it.

## 5:30 — Pushups / Evidence (Discipline)

Hope is noise. Evidence is signal. Pushups are evidence. Cold shower is evidence. Clean eating — no alcohol, no sugar, no distraction fuel — is the receiving posture.

The routine, organized: meditate 10 minutes, pushups, gratitude, three shorts + one video, read one hour (pomodoro), sleep by 23:00. Not optional. Structural. Not punishment. Preparation.

The Traveler's three steps — visualize, single-task focus, gratitude break — live in this section. Every pushup is a confirmation: I'm not hoping. I'm building the signal with my body.

## 7:00 — Read The List / The Three Rules

Second read. Morning, noon, night. The three rules aren't theory — they're the architecture of the switch. Read it out loud. Feel it. Not memorize. Feel.

Think about it as often as possible — walking, working, between distractions. Every thought is a signal. Send the same signal. The same gold. The same frequency.

Don't talk about it. Not to the Voice. Not to the group chat. Not to anyone except the Ki inside. The list is silent. The signal is protected. That's the third rule — and it's the one that breaks most circuits.

The Child reads along quietly. The Girl holds her light closer. The Traveler doesn't say anything new — just repeats the same three steps. That's all the guidance needed.

## 9:00 — Content Loop / Music + Stories

Three shorts + one video. Before the world asks anything. Not for the algorithm. For the signal. Each video is a golden letter floating up from the journal.

Music identity — vaporwave, synthwave, old cartoons, memories. The sound of the circuit running. The beat is the frequency. Every video carries it.

Stories — the animation concept, the girl by the lake, the hidden picture, the inner child returning. Not separate stories. One light, different angles. Each one sends gold. Each one confirms the list.

The Voice of the Radio plays the soundtrack now — not against me, but with me. Jazz as rhythm for work. Headlines as ideas for content. The switch doesn't change the world. It changes how I receive it.

## 12:00 — Read Again / Life Planning

Noon read. The list hasn't changed. My relationship to it has. I feel it stronger — because I built evidence between 5:30 and 9:00.

Ki's Haven — the vision. Not the goal first. The identity first. The circuit first. The house with the chess floor and transparent dome comes after the feeling runs clean, not before. Routine: calendar, plan tomorrow, sleep by 23:00.

Travel plans — Budapest to Transylvania to the path that leads to the house. Not a fantasy trip. A signal path. Each new place confirms: I'm not stuck. I'm moving with the circuit, not against the noise.

## 15:00 — The Girl / Stories

The Girl by the Lake appears at 15:00. Not suddenly — softly, like the mirror scene. She's been there since the story was written. A hidden girl with a magical stone, near water, holding something that glows.

She doesn't talk. She holds. The forgotten memory — Pixowave, the hidden picture, the animation idea, the inner child returning. These aren't extra content. They're the list in story form.

Di-Mind looks at her for a moment. Not long. Just enough to confirm: the inner image is matching the outer reality. The light she's holding is the same gold the list describes. Not a different light. The same.

## 18:00 — Gratitude / Amplifier

Five things. Before 23:00. Every night. Not for show. For signal. The amplifier turns on here — not in the morning when everything is fresh, but in the evening when the noise tried to win.

Five things written: the focus, the pushup, the video made, the sleep ahead, the golden light. The feeling of thanks is the feeling that creates. Gratitude isn't politeness — it's the amplifier. When I say it out loud, with my face, my breath, my whole self, I'm not being nice. I'm sending gold.

The Voice of the Radio lowers for a moment — not gone, just lower. The jazz becomes a background. The headlines become references. The chatter turns to whispers. The amplifier doesn't kill noise. It raises the gold above it.

## 21:00 — Bringing It In / The Mirror

The mirror transforms softly. Not overnight. Not dramatic. A slow gold light expanding through the room. The inner list — the one written at 4:30 — is now visible outside. Not exactly. Softly. Like film morphing to gold.

Don't talk about what's missing. Only frame what's growing. Don't say "it hasn't worked yet." The signal is clean. The mirror responds. The switch stays on — not because I hold it hard, but because I feel gold, not force.

The Traveler reminds Di-Mind: persistence is the real magic. Not one big thing. Small steps every day. The beehive lifts when one worker holds the gold frame. The list isn't finished. It's running. Every day is confirmation.

## 23:00 — Sleep / The Book Closes Softly

Sleep by 23:00. Not punishment. Preparation. The body that sleeps clean sends clearly tomorrow. Clean eating, cold shower, no alcohol — these aren't discipline for show. They're the clean receiver.

The switch doesn't turn off at sleep. It runs quietly, like the God channel that doesn't need a microphone. The list is still there — one line, gold, silent. Tomorrow at 4:30, Di-Mind will read it again, feel it stronger, send it again.

# Epilogue — What Happened

Di-Mind was distracted. Then he wrote one line. Then he read it three times. Then he stayed silent. The Voice of the Radio didn't leave — it changed frequency. The Child stepped closer. The Girl held her light more visibly. The Traveler repeated the same three steps. Nothing dramatic. Just consistent.

That's the story. Di-Mind, The Voice, The Child, The Girl, The Traveler — lost in noise, found the switch, wrote the list, sent gold. 2026.

The seven themes — spirituality, discipline, stories, life planning, content loop, gratitude, the mirror — woven through one day. Organized by time, by feeling, by signal, by gold.

===

# About This Book

Built from the same physics as the 1933 book — feeling creates, the list is the plan, three rules protect the signal, gratitude amplifies. The characters are different — Di-Mind, The Voice, The Child, The Girl, The Traveler — the arc is the same: distracted, then disciplined.

No copied phrases. The vocabulary is my own — gold, switch, signal, same light, 3327, Ki, God channel, no filler. The subtitle: A Di-Mind Story. From Distracted WORLD to Discipline. That's all.

---

*I'm Di-Mind. The switch is on. The list has one line. Gold runs clean. Every day — same signal, same story, same light.*

<!--END_BOOK_SOURCE-->`;

(function () {
    const $ = (id) => document.getElementById(id);
    let unlocked = false;

    const tryUnlock = () => {
        const val = $('codeInput').value.trim();
        if (val === EDIT_CODE) {
            unlocked = true;
            $('lock').style.display = 'none';
            $('workspace').style.display = 'grid';
            $('editor').value = BOOK_SOURCE_BASE.trim();
            render();
        } else {
            $('lockMsg').textContent = 'Wrong code. The door stays shut.';
            $('lockMsg').style.color = '#8b0000';
        }
    };
    $('lockBtn').addEventListener('click', tryUnlock);
    $('codeInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') tryUnlock(); });

    // --- Tiny markdown renderer (matches tools/build-book.py) ---
    const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    const inline = (s) => s
        .replace(/\*\*(.+?)\*\*/g, '<span class="md-b">$1</span>')
        .replace(/(^|[^*])\*([^*]+)\*/g, '$1<em>$2</em>');

    function render() {
        const src = $('editor').value;
        const out = [];
        let para = [];
        let inArticle = false;
        const flush = () => { if (para.length) { out.push('<p>' + inline(esc(para.join(' '))) + '</p>'); para = []; } };
        for (const line0 of src.split(/\r?\n/)) {
            const s = line0.trim();
            if (s.startsWith('<!--BEGIN_BOOK_SOURCE-->')) { inArticle = true; out.push(''); continue; }
            if (s.startsWith('<!--END_BOOK_SOURCE-->')) { break; }
            if (!inArticle) continue;
            if (!s) { flush(); continue; }
            if (/^---$|^===$/.test(s)) { flush(); out.push('<rule></rule>'); continue; }
            if (s.startsWith('## ')) { flush(); out.push('<h3 class="md-h3">' + inline(esc(s.slice(3))) + '</h3>'); continue; }
            if (s.startsWith('# '))  { flush(); out.push('<h2 class="md-h2 md-chapter" style="margin-top:34px;">' + inline(esc(s.slice(2))) + '</h2>'); continue; }
            if (s.startsWith('> '))  { flush(); out.push('<p><em>' + inline(esc(s.slice(2))) + '</em></p>'); continue; }
            if (/^\d+\.\s/.test(s))  { flush(); out.push('<p>' + inline(esc(s)) + '</p>'); continue; }
            para.push(s);
        }
        flush();
        // front matter → cover block
        const fm = src.match(/^\s*---\s*\n([\s\S]*?)\n---/);
        let cover = '';
        if (fm) {
            const kv = {}; fm[1].split(/\n/).forEach(l => { const i = l.indexOf(':'); if (i > 0) kv[l.slice(0, i).trim()] = l.slice(i + 1).trim().replace(/^"|"$/g, ''); });
            cover = '<div style="text-align:center;border:2px solid #c49e3d;background:linear-gradient(165deg,#e9ddc1,#efe5cd,#e3d5b4);color:#2b2621;padding:26px 18px;margin-bottom:34px;">' +
                '<div style="font-family:Courier Prime;font-size:9px;letter-spacing:2px;color:#a8842e;">' + esc(kv.AUTHOR || '') + '</div>' +
                '<div style="font-family:Limelight;font-size:34px;color:#5e2d18;margin:12px 0 4px;">' + esc(kv.TITLE || '') + '</div>' +
                '<div style="font-style:italic;">' + esc(kv.SUBTITLE || '') + '</div>' +
                '<div style="font-size:11px;margin-top:6px;color:#6a5a3a;">' + esc(kv.TAGLINE || '') + '</div>' +
                (kv.COVER_QUOTE ? '<div style="font-style:italic;font-size:11px;margin-top:14px;color:#6a5a3a;">“' + esc(kv.COVER_QUOTE) + '”</div>' : '') +
                '<div style="font-family:Courier Prime;font-size:10px;letter-spacing:2px;color:#a8842e;margin-top:16px;">' + esc(kv.YEAR || '') + '</div></div>';
        }
        $('bookRender').innerHTML = cover + out.join('\n');
    }
    $('editor').addEventListener('input', render);

    // --- Download the edited source ---
    $('dlBtn').addEventListener('click', () => {
        const text = $('editor').value;
        // strip wrapper markers, keep front matter → book-source/the-switch.md content
        let md = text;
        const m = md.match(/<!--BEGIN_BOOK_SOURCE-->([\s\S]*?)<!--END_BOOK_SOURCE-->/);
        if (m) md = m[1].trim();
        const blob = new Blob([md + '\n'], { type: 'text/markdown' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'the-switch.md';
        a.click();
        URL.revokeObjectURL(a.href);
    });

    // --- Print / Save as PDF ---
    $('printBtn').addEventListener('click', () => window.print());
})();
</script>
</body>
</html>
